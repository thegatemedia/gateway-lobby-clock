<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gateway Church | Lobby Clock</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#050505;color:white;font-family:Arial,Helvetica,sans-serif;overflow:hidden}main{height:100dvh;width:100vw;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:3vh 4vw;gap:1.7vh}.brand{font-weight:700;letter-spacing:.38em;font-size:clamp(25px,3.875vw,78px);margin-left:.38em;white-space:nowrap}.tagline{font-size:clamp(18px,1.9vw,39px);font-weight:500;letter-spacing:.23em;color:#c7c7c7;margin-top:-.8vh;white-space:nowrap}body.counting .tagline{font-size:clamp(17px,1.65vw,34px)}body.welcoming .tagline{display:none}.time{font-size:clamp(92px,19vw,380px);font-weight:750;letter-spacing:-.055em;line-height:1.08;font-variant-numeric:tabular-nums;white-space:nowrap}.ampm{font-size:.33em;letter-spacing:0;margin-left:.16em;vertical-align:middle}.date{font-size:clamp(24px,3.6vw,78px);color:#c7c7c7;letter-spacing:.025em}.rule{height:2px;width:min(68vw,1050px);background:#666;margin:1.5vh 0}.label{font-size:clamp(19px,2.65vw,55px);letter-spacing:.13em;font-weight:600}.countdown{font-size:clamp(78px,12vw,245px);font-weight:750;font-variant-numeric:tabular-nums;line-height:1.05;letter-spacing:-.03em}.service{font-size:clamp(22px,2.9vw,58px);color:#ccc}.countdown-area{display:none;flex-direction:column;align-items:center;gap:1vh;width:100%}body.counting .countdown-area{display:flex}.welcome-area{display:none;flex-direction:column;align-items:center;gap:3vh}.welcome-title{font-size:clamp(36px,6.2vw,120px);font-weight:750}.welcome-subtitle{font-size:clamp(34px,5.6vw,108px);font-weight:650}body.welcoming .brand,body.welcoming .time,body.welcoming .date,body.welcoming .countdown-area{display:none}body.welcoming .welcome-area{display:flex}body.counting .date{display:none}body.counting .time{font-size:clamp(75px,12vw,245px)}body.counting main{gap:1vh}body.counting .brand{font-size:clamp(23px,2.75vw,56px)}.rotating-message{font-size:clamp(20px,2.65vw,52px);font-weight:650;letter-spacing:.09em;color:#e7e7e7;margin-top:2.2vh;min-height:1.25em;transition:opacity .35s ease}body.welcoming .rotating-message,body.hide-message .rotating-message{display:none}body.counting .rotating-message{font-size:clamp(18px,2.3vw,46px);margin-top:1vh}body:not(.sunday) .rotating-message{display:none}body.sunday .date{display:none}body.sunday .rotating-message{font-size:clamp(25px,3.35vw,68px);margin-top:3.2vh;max-width:94vw;line-height:1.22}body.sunday.counting .rotating-message{font-size:clamp(22px,2.85vw,58px);margin-top:1.5vh}.controls{position:fixed;right:12px;bottom:12px;display:none;gap:6px}body.show-controls .controls{display:flex}.controls button{background:#222;color:white;border:1px solid #666;border-radius:5px;padding:9px 12px;font:14px Arial;cursor:pointer}.controls button.active{background:white;color:black}.hint{position:fixed;left:12px;bottom:14px;color:#777;font-size:12px;opacity:0}@media(max-width:700px){.brand{letter-spacing:.19em;margin-left:.19em}.time{font-size:18vw!important}.countdown{font-size:14vw}}
</style></head><body><main><div class="brand">GATEWAY CHURCH</div><div class="tagline">LOVE GOD. LOVE PEOPLE.</div><div class="time" id="time" aria-label="Current time">--:--<span class="ampm">AM</span></div><div class="date" id="date">Loading date...</div><div class="countdown-area" id="countdownArea"><div class="rule"></div><div class="label">NEXT SERVICE BEGINS IN</div><div class="countdown" id="countdown">30:00</div><div class="service" id="service">9:30 AM SERVICE</div></div><div class="rotating-message" id="rotatingMessage" aria-live="off"></div><div class="welcome-area"><div class="welcome-title">WELCOME TO GATEWAY CHURCH</div><div class="welcome-subtitle">SERVICE IS STARTING NOW</div></div></main><div class="controls" aria-label="Preview controls"><button data-mode="live" class="active">Live</button><button data-mode="sunday">Sunday Preview</button><button data-mode="930">9:30 Preview</button><button data-mode="1115">11:15 Preview</button><button data-mode="test">1-Min Test</button></div><script>
'use strict';
// Fixed to America/New_York so Eastern time and daylight saving changes are automatic.
const zone='America/New_York';
const clockFmt=new Intl.DateTimeFormat('en-US',{timeZone:zone,hour:'numeric',minute:'2-digit',hour12:true});
const dateFmt=new Intl.DateTimeFormat('en-US',{timeZone:zone,weekday:'long',month:'long',day:'numeric',year:'numeric'});
const partsFmt=new Intl.DateTimeFormat('en-US',{timeZone:zone,weekday:'short',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'});
let mode='live',previewEnd=0;
const messages=["WE'RE GLAD YOU'RE HERE!",'LIFE IS BETTER TOGETHER','EVERYONE HAS A NEXT STEP'];
const sundayMessages=[...messages,'GOOD COFFEE. GREAT COMMUNITY. GATEWAY GROUNDS.'];
const rotatingEl=document.getElementById('rotatingMessage');
const timeEl=document.getElementById('time'),dateEl=document.getElementById('date'),countEl=document.getElementById('countdown'),serviceEl=document.getElementById('service');
function getSundayWelcome(now){const p=Object.fromEntries(partsFmt.formatToParts(now).filter(x=>x.type!=='literal').map(x=>[x.type,x.value]));if(p.weekday!=='Sun')return false;const sec=Number(p.hour)*3600+Number(p.minute)*60+Number(p.second);return [9*3600+30*60,11*3600+15*60].some(t=>sec>=t&&sec<t+120)}
function getSundayCountdown(now){const parts=Object.fromEntries(partsFmt.formatToParts(now).filter(p=>p.type!=='literal').map(p=>[p.type,p.value]));if(parts.weekday!=='Sun')return null;const secs=Number(parts.hour)*3600+Number(parts.minute)*60+Number(parts.second);for(const s of [{at:9*3600+30*60,name:'9:30 AM SERVICE'},{at:11*3600+15*60,name:'11:15 AM SERVICE'}]){const remaining=s.at-secs;if(remaining>0&&remaining<=1800)return {remaining,name:s.name}}return null}
function render(){if(mode!=='live' && mode!=='sunday' && previewEnd>0 && Date.now()>=previewEnd+120000){mode='live';previewEnd=0;document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode==='live'));}const now=new Date();const formatted=clockFmt.format(now);const match=formatted.match(/^(.*?)\s*(AM|PM)$/i);timeEl.innerHTML=match?`${match[1]}<span class="ampm">${match[2]}</span>`:formatted;dateEl.textContent=dateFmt.format(now);let active=null;if(mode==='live'){active=getSundayCountdown(now)}else if(mode==='sunday'){active=null}else{const remaining=Math.max(0,Math.ceil((previewEnd-Date.now())/1000));active={remaining,name:mode==='930'?'9:30 AM SERVICE':mode==='1115'?'11:15 AM SERVICE':'TEST COUNTDOWN'};}const welcoming=mode==='live'?getSundayWelcome(now):(mode==='sunday'?false:(previewEnd>0&&Date.now()>=previewEnd&&Date.now()<previewEnd+120000));document.body.classList.toggle('welcoming',welcoming);document.body.classList.toggle('counting',!!active&&!welcoming);document.body.classList.toggle('hide-message',welcoming||(!!active&&active.remaining<=300));const day=partsFmt.formatToParts(now).find(p=>p.type==='weekday')?.value;const sundayView=day==='Sun'||mode==='sunday';document.body.classList.toggle('sunday',sundayView);const currentMessages=sundayView?sundayMessages:messages;rotatingEl.textContent=currentMessages[Math.floor(Date.now()/15000)%currentMessages.length];if(active){const m=Math.floor(active.remaining/60),s=active.remaining%60;countEl.textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;serviceEl.textContent=active.name}}
for(const button of document.querySelectorAll('[data-mode]'))button.addEventListener('click',()=>{mode=button.dataset.mode;if(mode!=='live'&&mode!=='sunday'){const duration=mode==='test'?60:mode==='930'?18*60:24*60;previewEnd=Date.now()+duration*1000}else{previewEnd=0}document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b===button));document.body.classList.remove('show-controls');render()});
// Google TV remote: press Up, Up, Down, Down, then OK/Select to open controls.
let remoteSequence=[];
const remoteUnlock=['ArrowUp','ArrowUp','ArrowDown','ArrowDown','Enter'];
document.addEventListener('keydown',event=>{
  const key=event.key==='Select'?'Enter':event.key;
  if(remoteUnlock.includes(key)){
    remoteSequence.push(key);
    remoteSequence=remoteSequence.slice(-remoteUnlock.length);
    if(remoteSequence.join('|')===remoteUnlock.join('|')){
      document.body.classList.toggle('show-controls');
      remoteSequence=[];
      event.preventDefault();
    }
  }else{
    remoteSequence=[];
  }
});
// Alternate touchscreen/mouse access: tap or click upper-right corner five times.
let cornerClicks=0,cornerLast=0;
const corner=document.createElement('div');
corner.setAttribute('aria-label','Hidden testing controls access');
corner.style.cssText='position:fixed;top:0;right:0;width:9vw;height:12vh;z-index:2;background:transparent;';
document.body.appendChild(corner);
corner.addEventListener('click',()=>{
  const now=Date.now();
  cornerClicks=(now-cornerLast>2500)?1:cornerClicks+1;
  cornerLast=now;
  if(cornerClicks>=5){document.body.classList.toggle('show-controls');cornerClicks=0;}
});
document.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='t'&&!e.ctrlKey&&!e.altKey&&!e.metaKey){document.body.classList.toggle('show-controls');}if(e.key==='Escape'||e.key==='Backspace'){document.body.classList.remove('show-controls');}});
render();setInterval(render,250);
</script></body></html>
